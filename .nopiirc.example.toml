version = 1

# scope ties pseudonyms together: same scope + key => same token across runs.
# Commit this file to share consistent pseudonymization policy across a team.
scope = "default"

[key]
env = "NOPII_KEY"
# file = "/run/secrets/nopii-key"

[output]
token_length = 12

[recognizers]
email = true
ipv4  = true
uuid  = true
phone = true

[git.date_clamp]
enabled             = true
granularity_seconds = 86400  # floor timestamps to this boundary (e.g. 86400 = daily, 90d = 7776000)

[classifiers.username]
label   = "USER"
pattern = '''(?m)(?:^|[[:space:]])@([A-Za-z0-9_-]+)'''
