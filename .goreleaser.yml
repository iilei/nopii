version: 2

project_name: nopii

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: nopii
    main: ./cmd/nopii
    binary: nopii
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/iilei/nopii/internal/cli.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

signs:
  - artifacts: checksum
    cmd: gpg
    args:
      - --batch
      - --yes
      - --pinentry-mode
      - loopback
      - --passphrase
      - "{{ .Env.GPG_PASSPHRASE }}"
      - --armor
      - --detach-sign
      - --output
      - "${artifact}.sig"
      - "${artifact}"

brews:
  - name: nopii
    repository:
      owner: iilei
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/iilei/nopii"
    description: "Pipe-first CLI for deterministic PII pseudonymization"
    license: "MIT"
    test: |
      system "#{bin}/nopii --help"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
